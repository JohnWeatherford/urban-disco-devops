<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>devOps</title>
</head>

<body>

  <h1>Welcome to my DevOps page</h1>

  <!-- Server JSON output -->
  <p id="serverVar">Loading server message...</p>

  <hr>

  <!-- QUERY PARAM -->
  <div>
    <h3>Query Parameter</h3>
    <input id="queryName" type="text" placeholder="Enter name">
    <button onclick="sendQuery()">Send Query</button>
    <div id="queryResult"></div>
  </div>

  <hr>

  <!-- POST BODY -->
  <div>
    <h3>POST Body</h3>
    <input id="bodyName" type="text" placeholder="Enter name">
    <button onclick="sendBody()">Send POST Body</button>
    <div id="bodyResult"></div>
  </div>

  <script>
    /* =========================
       FETCH SIMPLE JSON
    ========================= */

    fetch('/json')
      .then(res => res.json())
      .then(data => {
        document.getElementById('serverVar').textContent =
          `Server says: ${data.myVar}`;
      })
      .catch(() => {
        document.getElementById('serverVar').textContent =
          'Error fetching server data';
      });

    /* =========================
       QUERY PARAM
    ========================= */

    function sendQuery() {
      const name = document.getElementById('queryName').value;

      fetch(`/api/query?name=${encodeURIComponent(name)}`)
        .then(res => res.json())
        .then(data => {
          document.getElementById('queryResult').textContent =
            `Query result: ${data.name}`;
        });
    }

    /* =========================
       POST BODY
    ========================= */

    function sendBody() {
      const name = document.getElementById('bodyName').value;

      fetch('/api/data', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name })
      })
        .then(res => res.json())
        .then(data => {
          document.getElementById('bodyResult').textContent =
            `POST result: ${data.received.name}`;
        });
    }
  </script>

</body>

</html>
